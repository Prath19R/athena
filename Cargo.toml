[package]
name = "athena"
version = "0.1.0"
edition = "2021"
authors = ["Prathmesh Ranadive <prathmeshranadive@gmail.com>"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.6"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Element",
    "KeyboardEvent",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "Url",
    "UrlSearchParams",
    "Location"
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
