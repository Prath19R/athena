name: Deploy Athena Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Rust toolchain
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker

      # Install worker-build and ensure it's in PATH
      - name: Install worker-build
        uses: taiki-e/install-action@cargo-binstall
      - run: |
          cargo binstall --no-confirm worker-build
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Set up Node.js for latest Wrangler
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Explicit build step so we get clear compilation output
      - name: Build Rust Worker
        working-directory: worker
        run: worker-build --release

      # Deploy built artifacts to Cloudflare Workers with latest Wrangler
      - name: Deploy to Cloudflare Workers
        working-directory: worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Push NVIDIA_API_KEY as runtime Worker secret
      - name: Push NVIDIA_API_KEY to Worker
        working-directory: worker
        run: echo "${{ secrets.NVIDIA_API_KEY }}" | npx wrangler@latest secret put NVIDIA_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
